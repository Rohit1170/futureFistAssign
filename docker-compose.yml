version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: ai-analytics-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - ai-analytics-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-analytics-app
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/ai-analytics?authSource=admin
      JWT_SECRET: your_super_secret_jwt_key_change_this_in_production
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - '3000:3000'
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ai-analytics-network
    volumes:
      - ./uploads:/app/uploads

networks:
  ai-analytics-network:
    driver: bridge

volumes:
  mongodb_data:
